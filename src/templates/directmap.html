<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Realty — Interactive Price Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="/static/css/directmap.css">
</head>
<body>

<header class="app-header">
  <h1>Sound Realty — Price Predictor</h1>
  <p class="subtitle">Click the map to estimate a property's value</p>
</header>

<main class="layout">

  <!-- Map -->
  <section class="map-container">
    <div id="map"></div>
  </section>

  <!-- Controls panel -->
  <aside class="controls-panel">

    <!-- Location info -->
    <div class="card location-card">
      <h2>Location</h2>
      <div class="location-grid">
        <span class="label">Latitude</span>
        <span id="info-lat" class="value">—</span>
        <span class="label">Longitude</span>
        <span id="info-lon" class="value">—</span>
        <span class="label">ZIP Code</span>
        <span id="info-zip" class="value">—</span>
        <span class="label">City</span>
        <span id="info-city" class="value">—</span>
        <span class="label">State</span>
        <span id="info-state" class="value">—</span>
      </div>
      <p id="geo-status" class="status-msg hidden"></p>
    </div>

    <!-- Sliders -->
    <div class="card sliders-card">
      <h2>Property Features</h2>

      <div class="slider-group">
        <label for="bedrooms">Bedrooms: <span id="bedrooms-val">3</span></label>
        <input type="range" id="bedrooms" min="0" max="10" value="3" step="1">
      </div>

      <div class="slider-group">
        <label for="bathrooms">Bathrooms: <span id="bathrooms-val">2</span></label>
        <input type="range" id="bathrooms" min="0" max="8" value="2" step="1">
      </div>

      <div class="slider-group">
        <label for="sqft_living">Living Area (sqft): <span id="sqft_living-val">1,500</span></label>
        <input type="range" id="sqft_living" min="200" max="10000" value="1500" step="50">
      </div>

      <div class="slider-group">
        <label for="sqft_lot">Lot Size (sqft): <span id="sqft_lot-val">5,000</span></label>
        <input type="range" id="sqft_lot" min="500" max="100000" value="5000" step="100">
      </div>

      <div class="slider-group">
        <label for="floors">Floors: <span id="floors-val">1</span></label>
        <input type="range" id="floors" min="1" max="4" value="1" step="1">
      </div>
    </div>

    <!-- Prediction result -->
    <div class="card prediction-card">
      <h2>Estimated House Price</h2>
      <p id="prediction-value" class="price">—</p>
      <p id="prediction-status" class="status-msg hidden"></p>
    </div>

  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="/static/js/directmap.js"></script>
</body>
</html>
